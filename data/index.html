<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script type="text/javascript" src="./js/moment-with-locales.js"></script>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/jquery.minicolors.css">
    <style>
        #colorPicker {
            overscroll-behavior: contain;
            touch-action: none;
        }
    </style>
    <title>7 Segment Clock</title>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="./index.html">7 Segment Clock</a>
    </nav>

    <div class="row" style="margin: 10px 10px;">
        <div class="col-12">

            <div class="card">
                <div class="card-body">

                    <div class="form-group" id="colorPicker">
                        <input type="text" id="inline" class="form-control demo" data-inline="true" value="#00C8FF">
                    </div>
                    <button type="button" class="btn btn-primary" onclick="setColor()">Update Color</button>

                </div>
            </div>
            <br />
            <div class="card">
                <div class="card-body">

                    <div class="form-group">
                        <label for="rangeBrightness">Brightness:
                            <span id="brightnessValue">20%</span>
                        </label>
                        <input type="range" class="form-control-range" id="rangeBrightness" min="10" max="255"
                            value="50">
                    </div>
                    <button type="button" class="btn btn-primary" onclick="setBrightness()">Update Brightness</button>

                </div>
            </div>
            <br />
            <div class="card">
                <div class="card-body">

                    <div class="form-group">
                        <label for="hourFormat">Hour Format</label>
                        <select class="form-control" id="hourFormat">
                            <option value="24">24</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="updateHourFormat()">Update Hour
                        Format</button>

                </div>
            </div>
        </div>
    </div>


    <script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/jquery.minicolors.min.js"></script>
    <script type="text/javascript" src="js/index.js"></script>

</body>
    
    <script>
      const brightnessSlider = document.getElementById("rangeBrightness");
      const brightnessValue = document.getElementById("brightnessValue");

      function updateBrightnessDisplay() {
      const value = parseInt(brightnessSlider.value);
      const percent = Math.round((value / 255) * 100);
      brightnessValue.textContent = percent + "%";
      }
      brightnessSlider.addEventListener("input", updateBrightnessDisplay);
      updateBrightnessDisplay();
    </script>

</html>
